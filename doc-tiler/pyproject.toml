[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tiler"
version = "3.2.0"
description = "Turns documents (PDF/URL/MHTML/IMG) into fixed-geometry image tiles for a screenshot-RAG embedder, with on-demand tile regeneration and indexed metadata search."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

# Single source of truth for runtime dependencies. The Docker build reads this
# list straight out of pyproject (see Dockerfile) — there is no requirements.txt.
dependencies = [
    "fastapi==0.162.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "uvicorn[standard]==0.54.0",
    "playwright==1.64.1",
    "pymupdf==1.28.2",
    "pillow==13.0.0",
    "aiosqlite==0.22.1",
    "pysqlite3-binary==0.5.4.post2",
    "python-multipart==0.0.32",
    "pyyaml==6.0.3",
    "prometheus-client==0.26.0",
    "orjson==3.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "httpx2==2.16.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.hatch.build.targets.wheel]
packages = ["tiler"]

[tool.hatch.build.targets.sdist]
include = [
    "tiler",
    "docs",
    "deploy/metadata_schema.yaml",
    "README.md",
]
