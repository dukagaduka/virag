openapi: 3.1.0
info:
  title: Tiler Service API
  version: "3.2.0"
  description: >
    Turns documents (PDF / URL / MHTML / IMG) into fixed-geometry image tiles
    (width=875, height<=1024) for a pixel-based RAG embedder, and regenerates any
    single tile on demand from the stored original. Metadata is stored as JSON on the
    document and made searchable via SQLite expression indexes over operator-declared
    keys (no fallback scan). A DB/volume is bound to one tiling geometry for life;
    booting with a different geometry is a fatal startup error. Out of scope:
    embedding, vector DB, retrieval.

servers:
  - url: http://localhost:8000

paths:
  /tile:
    post:
      operationId: ingestDocument
      summary: Ingest a document, tile it, optionally store it, and return the tiles.
      description: >
        Renders at the fixed geometry and returns the tile manifest (with base64 tile
        bytes when include_bytes=true). store=true persists the original + metadata so
        tiles are regenerable via /get_tile. store=false persists nothing (pure
        transform); include_bytes is then forced true and metadata is ignored.
      parameters:
        - { name: store,         in: query, required: false, schema: { type: boolean, default: true },  description: Persist the original + metadata so tiles are regenerable later. }
        - { name: include_bytes, in: query, required: false, schema: { type: boolean, default: true },  description: Include base64 JPEG bytes per tile. Forced true when store=false. }
        - { name: force,         in: query, required: false, schema: { type: boolean, default: false }, description: Re-render even if this doc_id already exists. }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [doc_type]
              properties:
                doc_type: { $ref: '#/components/schemas/DocType' }
                document:
                  type: string
                  format: binary
                  description: Raw document bytes. Required unless doc_type=URL.
                url:
                  type: string
                  format: uri
                  description: Source URL. Required iff doc_type=URL.
                metadata:
                  type: string
                  description: >
                    JSON object serialized as a string. Declared keys (see
                    /schema/metadata) become searchable; other keys are stored but not
                    searchable. Ignored when store=false.
            encoding:
              document: { contentType: application/octet-stream }
      responses:
        '200':
          description: Tiling result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestManifest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMedia' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }

  /get_tile:
    get:
      operationId: getTile
      summary: Regenerate a single tile from the stored original.
      parameters:
        - { name: doc_id,   in: query, required: true,  schema: { type: string } }
        - { name: tile_num, in: query, required: true,  schema: { type: integer, minimum: 0 } }
        - { name: verify,   in: query, required: false, schema: { type: boolean, default: true }, description: Compare regenerated bytes against the stored image_hash. }
      responses:
        '200':
          description: The tile as JPEG.
          headers:
            X-Doc-Id:      { schema: { type: string } }
            X-Tile-Num:    { schema: { type: integer } }
            X-Image-Hash:  { schema: { type: string } }
            X-Tile-Height: { schema: { type: integer }, description: Actual tile height in px. }
            X-Tile-Width:  { schema: { type: integer }, description: Always TILE_WIDTH (875). }
            Cache-Control: { schema: { type: string }, description: Immutable; tiles are content-addressed. }
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        '400':
          description: tile_num is out of range for this document (TILE_OUT_OF_RANGE).
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Regenerated tile hash does not match the stored hash (render drift), strict policy.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /doc/{doc_id}:
    get:
      operationId: downloadOriginal
      summary: Download the original stored blob.
      parameters:
        - { name: doc_id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: >
            Original document bytes. Content-Type is the document's stored mime_type
            (application/pdf, multipart/related, image/*), not a fixed type.
          headers:
            Content-Disposition: { schema: { type: string } }
            Accept-Ranges:       { schema: { type: string } }
            X-Doc-Id:            { schema: { type: string } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '206':
          description: Partial content when a Range header is supplied.
          headers:
            Content-Range:  { schema: { type: string } }
            Content-Length: { schema: { type: integer } }
            X-Doc-Id:       { schema: { type: string } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/NotFound' }
        '416':
          description: Requested Range is not satisfiable (RANGE_NOT_SATISFIABLE).
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    delete:
      operationId: deleteDocument
      summary: Delete a document, its tiles rows, and blob. (Optional, flag-guarded.)
      parameters:
        - { name: doc_id, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Deleted. }
        '404': { $ref: '#/components/responses/NotFound' }
        '405':
          description: Deletion is disabled (start with ALLOW_DELETE=true) — DELETE_DISABLED.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /doc/{doc_id}/metadata:
    get:
      operationId: getMetadata
      summary: Read the metadata object for a document.
      parameters:
        - { name: doc_id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Metadata object (empty object if none)., content: { application/json: { schema: { $ref: '#/components/schemas/MetadataObject' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: replaceMetadata
      summary: Replace the whole metadata object (validated; indexes update automatically).
      parameters:
        - { name: doc_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MetadataObject' } } }
      responses:
        '200': { description: Updated., content: { application/json: { schema: { $ref: '#/components/schemas/MetadataObject' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    patch:
      operationId: mergeMetadata
      summary: Shallow-merge metadata (null value deletes a key; validated).
      parameters:
        - { name: doc_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MetadataObject' } } }
      responses:
        '200': { description: Merged result., content: { application/json: { schema: { $ref: '#/components/schemas/MetadataObject' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /docs/search:
    post:
      operationId: searchDocs
      summary: List and/or search documents by metadata (single endpoint; replaces GET /docs).
      description: >
        Filters are AND-combined and evaluated over expression-indexed, declared keys.
        Every filter key must be declared in the metadata schema; an undeclared key
        returns 400. Omitting filters (or an empty list) lists all documents, newest first.
        Cursor-paginated.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SearchRequest' }
      responses:
        '200':
          description: A page of documents.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocList' }
        '400':
          description: >
            Invalid filter: an undeclared key (UNDECLARED_FILTER_KEY), an unsupported op,
            a numeric op on a text field, an uncoercible value, or a malformed cursor.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /schema/metadata:
    get:
      operationId: getMetadataSchema
      summary: Return the operator-declared metadata schema (which keys are searchable).
      responses:
        '200':
          description: The declared schema.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MetadataSchema' }

  /info:
    get:
      operationId: info
      summary: Effective geometry, render_version, policy, pools and cache stats.
      responses:
        '200':
          description: Service configuration and runtime stats.
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:        { type: string }
                  geometry:       { type: object, additionalProperties: { type: integer } }
                  render_version: { type: string }
                  pixel_tier:     { type: object, additionalProperties: true }
                  policy:         { type: object, additionalProperties: true }
                  pools:          { type: object, additionalProperties: true }
                  cache:          { type: object, additionalProperties: true }
                  docs:           { type: integer }

  /healthz:
    get:
      operationId: healthz
      summary: Liveness.
      responses: { '200': { description: OK. } }
  /readyz:
    get:
      operationId: readyz
      summary: Readiness (DB, blob dir, Chromium pool).
      responses:
        '200': { description: Ready. }
        '503': { description: Not ready. }
  /metrics:
    get:
      operationId: metrics
      summary: Prometheus metrics.
      responses: { '200': { description: Prometheus text exposition., content: { text/plain: { schema: { type: string } } } } }

components:
  schemas:
    DocType:
      type: string
      enum: [PDF, URL, MHTML, IMG]

    StoredDocType:
      type: string
      description: Effective stored type (URL is stored as MHTML).
      enum: [PDF, MHTML, IMG]

    TileMeta:
      type: object
      required: [tile_num, width, height, image_hash]
      properties:
        tile_num:   { type: integer, minimum: 0 }
        width:      { type: integer, description: Always TILE_WIDTH (875). }
        height:     { type: integer, description: Actual tile height in px. }
        image_hash: { type: string, description: sha256 of the JPEG bytes. }
        data:
          type: string
          format: byte
          description: Base64 JPEG bytes. Present iff include_bytes=true.

    IngestManifest:
      type: object
      required: [doc_id, doc_type, render_version, stored, page_height, tile_count, tiles]
      properties:
        doc_id:         { type: string, description: sha256(blob) hex. }
        doc_type:       { $ref: '#/components/schemas/StoredDocType' }
        source_url:     { type: [string, "null"], format: uri }
        render_version: { type: string }
        stored:         { type: boolean }
        page_height:    { type: integer, description: Full-page height for web/mhtml/img; 0 for PDF. }
        tile_count:     { type: integer }
        tiles:
          type: array
          items: { $ref: '#/components/schemas/TileMeta' }

    DocSummary:
      type: object
      required: [doc_id, doc_type, tile_count, created_at]
      properties:
        doc_id:     { type: string }
        doc_type:   { $ref: '#/components/schemas/StoredDocType' }
        tile_count: { type: integer }
        created_at: { type: integer, description: Unix epoch seconds. }
        source_url: { type: [string, "null"], format: uri }
        metadata:   { $ref: '#/components/schemas/MetadataObject' }

    DocList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/DocSummary' }
        next_cursor:
          type: [string, "null"]
          description: Pass as cursor to fetch the next page; null when exhausted.

    SearchFilter:
      type: object
      required: [key, value]
      properties:
        key:
          type: string
          description: Dotted JSON path; MUST be a declared/indexed key (else 400).
        op:
          type: string
          enum: [eq, ne, gt, gte, lt, lte]
          default: eq
        value:
          description: String for eq/ne on text fields; number for gt/gte/lt/lte on number fields.
          oneOf:
            - { type: string }
            - { type: number }

    SearchRequest:
      type: object
      properties:
        filters:
          type: array
          default: []
          description: AND-combined. Empty/omitted lists all documents, newest first.
          items: { $ref: '#/components/schemas/SearchFilter' }
        limit:  { type: integer, minimum: 1, maximum: 500, default: 50 }
        cursor: { type: [string, "null"] }

    MetadataObject:
      type: object
      description: Arbitrary JSON object. Declared keys are searchable; others stored only.
      additionalProperties: true

    MetadataFieldType:
      type: string
      enum: [text, number]

    MetadataSchema:
      type: object
      required: [version, fields]
      properties:
        version: { type: integer }
        fields:
          type: array
          items:
            type: object
            required: [key, type]
            properties:
              key:      { type: string, description: Dotted JSON path. }
              type:     { $ref: '#/components/schemas/MetadataFieldType' }
              required: { type: boolean, default: false }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: >
                Machine-readable error code. Non-exhaustive vocabulary:
                UNKNOWN_DOC_TYPE, AMBIGUOUS_INPUT, MISSING_URL, MISSING_FILE,
                PAYLOAD_TOO_LARGE, UNSUPPORTED_MEDIA, SSRF_BLOCKED, UNKNOWN_DOC,
                MISSING_BLOB, UNKNOWN_TILE, TILE_OUT_OF_RANGE, RANGE_NOT_SATISFIABLE,
                DELETE_DISABLED, UNDECLARED_FILTER_KEY, INVALID_METADATA_JSON,
                METADATA_SCHEMA_VIOLATION, RENDER_MISMATCH, DECODE_FAILED,
                EMPTY_DOCUMENT, BROWSER_UNAVAILABLE, RENDER_TIMEOUT, UPSTREAM_FAILURE,
                WORKER_CRASH, VALIDATION_ERROR, INTERNAL_ERROR.
            message: { type: string }
            details: { type: object, additionalProperties: true }

  responses:
    BadRequest:        { description: Bad request., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Forbidden:         { description: Blocked (e.g. SSRF)., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    NotFound:          { description: Not found., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    TooLarge:          { description: Payload too large., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    UnsupportedMedia:  { description: Content-type does not match declared doc_type., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Unprocessable:     { description: Corrupt document or invalid/schema-violating metadata., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    BadGateway:        { description: Upstream fetch/render failure., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    GatewayTimeout:    { description: Render timeout., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
