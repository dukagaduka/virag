openapi: 3.1.0
info:
  title: Tiler Service API
  version: "3.2.0"
  description: >
    Turns documents (PDF / URL / MHTML / IMG) into fixed-geometry image tiles
    (width=875, height<=1024) for a pixel-based RAG embedder, and regenerates any
    single tile on demand from the stored original. Metadata is stored as JSON on the
    document and made searchable via SQLite expression indexes over operator-declared
    keys (no fallback scan). A DB/volume is bound to one tiling geometry for life;
    booting with a different geometry is a fatal startup error. render_version is
    bound the same way: stored docs from another render_version are re-rendered by a
    revision before the service serves (data routes answer 503 NOT_READY until then).
    Out of scope: embedding, vector DB, retrieval.

servers:
  - url: http://localhost:8000

# Every route needs `Authorization: Bearer <TILER_API_KEY>` (empty key = open) except
# /healthz, /readyz and /metrics, which override it with `security: []`.
security:
  - bearerAuth: []

paths:
  /tile:
    post:
      operationId: ingestDocument
      summary: Ingest a document, tile it, optionally store it, and return the tiles.
      description: >
        Renders at the fixed geometry and returns the tile manifest (with base64 tile
        bytes when include_bytes=true). store=true persists the original + metadata so
        tiles are regenerable via /get_tile. store=false persists nothing (pure
        transform); include_bytes is then forced true and metadata is ignored.
      parameters:
        - { name: store,         in: query, required: false, schema: { type: boolean, default: true },  description: Persist the original + metadata so tiles are regenerable later. }
        - { name: include_bytes, in: query, required: false, schema: { type: boolean, default: true },  description: Include base64 JPEG bytes per tile. Forced true when store=false. }
        - { name: force,         in: query, required: false, schema: { type: boolean, default: false }, description: Re-render even if this doc_id already exists. }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [doc_type]
              properties:
                doc_type: { $ref: '#/components/schemas/DocType' }
                document:
                  type: string
                  format: binary
                  description: Raw document bytes. Required unless doc_type=URL.
                url:
                  type: string
                  format: uri
                  description: Source URL. Required iff doc_type=URL.
                metadata:
                  type: string
                  description: >
                    JSON object serialized as a string. Declared keys (see
                    /schema/metadata) become searchable; other keys are stored but not
                    searchable. Ignored when store=false.
            encoding:
              document: { contentType: application/octet-stream }
      responses:
        '503': { $ref: '#/components/responses/NotReady' }
        '200':
          description: Tiling result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestManifest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMedia' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }

  /tile/stream:
    post:
      operationId: ingestDocumentStream
      summary: Ingest a document and stream its tiles as NDJSON, then a `committed` event.
      description: >
        Same form fields as /tile, but always stores and always includes tile bytes
        (no store/include_bytes params). The response is newline-delimited JSON
        (application/x-ndjson), one event object per line, streamed as tiles render: a
        `begin` event first (identity, so a client can build point ids before tiles
        arrive), a `tile` event per tile (for PDFs, streamed group-by-group as each group
        finishes — order is not guaranteed monotonic), then a terminal `committed` event
        on success. The doc is persisted incrementally and stays incomplete until the
        final tile; a stream that dies mid-way leaves a swept-able partial, never a
        servable half-doc. Pre-flight errors (unknown doc_type 400, oversize 413, media
        mismatch 415) are normal HTTP errors returned before streaming begins; once the
        200 stream has started, any failure is reported as an in-stream `error` event and
        the absence of a `committed` event is the client's signal that ingest did not
        complete. Identical bytes of an already-complete doc replay the stored tiles as
        the same event stream without re-rendering (unless force).
      parameters:
        - { name: force, in: query, required: false, schema: { type: boolean, default: false }, description: Re-render even if this doc_id already exists (skip the idempotency replay). }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [doc_type]
              properties:
                doc_type: { $ref: '#/components/schemas/DocType' }
                document:
                  type: string
                  format: binary
                  description: Raw document bytes. Required unless doc_type=URL.
                url:
                  type: string
                  format: uri
                  description: Source URL. Required iff doc_type=URL.
                metadata:
                  type: string
                  description: >
                    JSON object serialized as a string. Declared keys (see
                    /schema/metadata) become searchable; other keys are stored but not
                    searchable.
            encoding:
              document: { contentType: application/octet-stream }
      responses:
        '503': { $ref: '#/components/responses/NotReady' }
        '200':
          description: >
            The tiling event stream (newline-delimited JSON). Each line is one
            StreamEvent object. A terminal `committed` event means success; a terminal
            `error` event (or a stream that ends without `committed`) means the ingest
            did not complete.
          content:
            application/x-ndjson:
              schema: { $ref: '#/components/schemas/StreamEvent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMedia' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /revision:
    get:
      operationId: revisionStatus
      summary: Status of the serving gate and of the current or last revision.
      responses:
        '200':
          description: Revision status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RevisionStatus' }
    post:
      operationId: startRevision
      summary: Start a background revision; the service is not-ready until it finishes.
      description: >
        Re-renders, from their stored original blobs, every complete doc rendered by
        another render_version than the tiler's (every complete doc with force=true,
        quarantined ones included). Per doc, tiles and layout are swapped in one
        transaction; doc_id and metadata are untouched. A doc that fails twice is
        quarantined (its tiles answer 410). Data routes answer 503 NOT_READY until the
        job finishes. Startup runs the same job on its own when
        TILER_REVISION_ON_RENDER_MISMATCH=true. It does not touch any downstream
        (e.g. Qdrant).
      parameters:
        - { name: force, in: query, required: false, schema: { type: boolean, default: false }, description: Re-render every complete doc, not only those from another render_version. }
      responses:
        '202':
          description: Started; the status of the new job.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RevisionStatus' }
        '409':
          description: A revision is already running (REVISION_RUNNING).
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /get_tile:
    get:
      operationId: getTile
      summary: Regenerate a single tile from the stored original.
      parameters:
        - { name: doc_id,   in: query, required: true,  schema: { type: string } }
        - { name: tile_num, in: query, required: true,  schema: { type: integer, minimum: 0 } }
        - { name: verify,   in: query, required: false, schema: { type: boolean, default: true }, description: Compare regenerated bytes against the stored image_hash. }
      responses:
        '503': { $ref: '#/components/responses/NotReady' }
        '200':
          description: The tile as JPEG.
          headers:
            X-Doc-Id:         { schema: { type: string } }
            X-Tile-Num:       { schema: { type: integer } }
            X-Image-Hash:     { schema: { type: string } }
            X-Render-Version: { schema: { type: string }, description: The render_version that rendered the tile. }
            X-Tile-Height:    { schema: { type: integer }, description: Actual tile height in px. }
            X-Tile-Width:     { schema: { type: integer }, description: Always TILE_WIDTH (875). }
            Cache-Control:    { schema: { type: string }, description: Immutable; tiles are content-addressed. }
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        '400':
          description: tile_num is out of range for this document (TILE_OUT_OF_RANGE).
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Regenerated tile hash does not match the stored hash (RENDER_MISMATCH) — non-determinism, since every served doc was rendered by the current render_version.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '410':
          description: The doc is quarantined — a revision could not re-render it (QUARANTINED). Re-ingest its bytes to restore it.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /doc/{doc_id}:
    get:
      operationId: downloadOriginal
      summary: Download the original stored blob.
      parameters:
        - { name: doc_id, in: path, required: true, schema: { type: string } }
      responses:
        '503': { $ref: '#/components/responses/NotReady' }
        '200':
          description: >
            Original document bytes. Content-Type is the document's stored mime_type
            (application/pdf, multipart/related, image/*), not a fixed type.
          headers:
            Content-Disposition: { schema: { type: string } }
            Accept-Ranges:       { schema: { type: string } }
            X-Doc-Id:            { schema: { type: string } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '206':
          description: Partial content when a Range header is supplied.
          headers:
            Content-Range:  { schema: { type: string } }
            Content-Length: { schema: { type: integer } }
            X-Doc-Id:       { schema: { type: string } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/NotFound' }
        '416':
          description: Requested Range is not satisfiable (RANGE_NOT_SATISFIABLE).
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    delete:
      operationId: deleteDocument
      summary: Delete a document, its tiles rows, and blob. (Optional, flag-guarded.)
      parameters:
        - { name: doc_id, in: path, required: true, schema: { type: string } }
      responses:
        '503': { $ref: '#/components/responses/NotReady' }
        '204': { description: Deleted. }
        '404': { $ref: '#/components/responses/NotFound' }
        '405':
          description: Deletion is disabled (start with ALLOW_DELETE=true) — DELETE_DISABLED.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /doc/{doc_id}/metadata:
    get:
      operationId: getMetadata
      summary: Read the metadata object for a document.
      parameters:
        - { name: doc_id, in: path, required: true, schema: { type: string } }
      responses:
        '503': { $ref: '#/components/responses/NotReady' }
        '200': { description: Metadata object (empty object if none)., content: { application/json: { schema: { $ref: '#/components/schemas/MetadataObject' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: replaceMetadata
      summary: Replace the whole metadata object (validated; indexes update automatically).
      parameters:
        - { name: doc_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MetadataObject' } } }
      responses:
        '503': { $ref: '#/components/responses/NotReady' }
        '200': { description: Updated., content: { application/json: { schema: { $ref: '#/components/schemas/MetadataObject' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    patch:
      operationId: mergeMetadata
      summary: Shallow-merge metadata (null value deletes a key; validated).
      parameters:
        - { name: doc_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MetadataObject' } } }
      responses:
        '503': { $ref: '#/components/responses/NotReady' }
        '200': { description: Merged result., content: { application/json: { schema: { $ref: '#/components/schemas/MetadataObject' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /docs/search:
    post:
      operationId: searchDocs
      summary: List and/or search documents by metadata (single endpoint; replaces GET /docs).
      description: >
        Filters are AND-combined and evaluated over expression-indexed, declared keys.
        Every filter key must be declared in the metadata schema; an undeclared key
        returns 400. Omitting filters (or an empty list) lists all documents, newest first.
        Cursor-paginated.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SearchRequest' }
      responses:
        '503': { $ref: '#/components/responses/NotReady' }
        '200':
          description: A page of documents.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocList' }
        '400':
          description: >
            Invalid filter: an undeclared key (UNDECLARED_FILTER_KEY), an unsupported op,
            a numeric op on a text field, an uncoercible value, or a malformed cursor.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /schema/metadata:
    get:
      operationId: getMetadataSchema
      summary: Return the operator-declared metadata schema (which keys are searchable).
      responses:
        '200':
          description: The declared schema.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MetadataSchema' }

  /info:
    get:
      operationId: info
      summary: Effective geometry, render_version, revision gate, policy, pools and cache stats.
      responses:
        '200':
          description: Service configuration and runtime stats; always served, revision or not.
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:        { type: string }
                  geometry:       { type: object, additionalProperties: { type: integer } }
                  render_version: { type: string }
                  volume_id:      { type: string, description: Random id given to the volume at init; identifies it for life. Not a secret. }
                  pixel_tier:     { type: object, additionalProperties: true }
                  revision:       { $ref: '#/components/schemas/RevisionStatus' }
                  policy:         { type: object, additionalProperties: true }
                  pools:          { type: object, additionalProperties: true }
                  cache:          { type: object, additionalProperties: true }
                  docs:           { type: integer }

  /healthz:
    get:
      security: []
      operationId: healthz
      summary: Liveness (the container HEALTHCHECK; stays 200 through a revision).
      responses: { '200': { description: OK. } }
  /readyz:
    get:
      security: []
      operationId: readyz
      summary: Readiness (DB, blob dir, Chromium pool, revision gate).
      responses:
        '200': { description: Ready. }
        '503': { description: Not ready — including while a revision is pending or running (checks.revision). }
  /metrics:
    get:
      security: []
      operationId: metrics
      summary: Prometheus metrics.
      responses: { '200': { description: Prometheus text exposition., content: { text/plain: { schema: { type: string } } } } }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: TILER_API_KEY.

  schemas:
    DocType:
      type: string
      description: Declared document type. A stored doc is never URL (a URL ingest is stored as MHTML).
      enum: [PDF, URL, MHTML, IMG]

    TileMeta:
      type: object
      required: [tile_num, width, height, image_hash]
      properties:
        tile_num:   { type: integer, minimum: 0 }
        width:      { type: integer, description: Always TILE_WIDTH (875). }
        height:     { type: integer, description: Actual tile height in px. }
        image_hash: { type: string, description: sha256 of the JPEG bytes. }
        data:
          type: string
          format: byte
          description: Base64 JPEG bytes. Present iff include_bytes=true.

    IngestManifest:
      type: object
      required: [doc_id, doc_type, render_version, stored, page_height, tile_count, tiles]
      properties:
        doc_id:         { type: string, description: sha256(blob) hex. }
        doc_type:       { $ref: '#/components/schemas/DocType' }
        source_url:     { type: [string, "null"], format: uri }
        render_version: { type: string }
        stored:         { type: boolean }
        page_height:    { type: integer, description: Full-page height for web/mhtml/img; 0 for PDF. }
        tile_count:     { type: integer }
        tiles:
          type: array
          items: { $ref: '#/components/schemas/TileMeta' }

    DocSummary:
      type: object
      required: [doc_id, doc_type, tile_count, created_at]
      properties:
        doc_id:         { type: string }
        doc_type:       { $ref: '#/components/schemas/DocType' }
        tile_count:     { type: integer }
        complete:       { type: boolean, default: true, description: False while a streaming ingest is still in flight (or crashed); such a doc is not servable via /get_tile. }
        quarantined:    { type: boolean, default: false, description: True when a revision could not re-render the doc; its tiles answer 410 until it is re-ingested. }
        render_version: { type: [string, "null"], description: The render_version stamped on the doc at ingest. }
        created_at:     { type: integer, description: Unix epoch seconds. }
        source_url:     { type: [string, "null"], format: uri }
        metadata:       { $ref: '#/components/schemas/MetadataObject' }

    StreamEvent:
      description: >
        One line of the /tile/stream NDJSON response. The `event` field discriminates:
        `begin` (identity, emitted first), `tile` (one per tile; data is base64 JPEG),
        `committed` (terminal success), `error` (terminal failure).
      oneOf:
        - $ref: '#/components/schemas/StreamBegin'
        - $ref: '#/components/schemas/StreamTile'
        - $ref: '#/components/schemas/StreamCommitted'
        - $ref: '#/components/schemas/StreamError'
      discriminator:
        propertyName: event
        mapping:
          begin:     '#/components/schemas/StreamBegin'
          tile:      '#/components/schemas/StreamTile'
          committed: '#/components/schemas/StreamCommitted'
          error:     '#/components/schemas/StreamError'

    StreamBegin:
      type: object
      required: [event, doc_id, doc_type, render_version]
      properties:
        event:          { type: string, enum: [begin] }
        doc_id:         { type: string, description: sha256(blob) hex. }
        doc_type:       { $ref: '#/components/schemas/DocType' }
        source_url:     { type: [string, "null"], format: uri }
        render_version: { type: string }

    StreamTile:
      type: object
      required: [event, tile_num, width, height, image_hash, data]
      properties:
        event:      { type: string, enum: [tile] }
        tile_num:   { type: integer, minimum: 0 }
        width:      { type: integer, description: Always TILE_WIDTH (875). }
        height:     { type: integer, description: Actual tile height in px. }
        image_hash: { type: string, description: sha256 of the JPEG bytes. }
        data:       { type: string, format: byte, description: Base64 JPEG bytes (always present on the stream). }

    StreamCommitted:
      type: object
      required: [event, doc_id, doc_type, render_version, page_height, tile_count]
      properties:
        event:          { type: string, enum: [committed] }
        doc_id:         { type: string }
        doc_type:       { $ref: '#/components/schemas/DocType' }
        source_url:     { type: [string, "null"], format: uri }
        render_version: { type: string }
        page_height:    { type: integer, description: Full-page height for web/mhtml/img; 0 for PDF. }
        tile_count:     { type: integer }

    StreamError:
      type: object
      required: [event, code, message]
      properties:
        event:   { type: string, enum: [error] }
        code:    { type: string, description: Machine-readable error code (see Error). }
        message: { type: string }

    RevisionStatus:
      type: object
      required: [state, serving]
      properties:
        state:
          type: string
          enum: [idle, required, running, succeeded, failed]
          description: >
            idle — nothing to revise; required — docs from another render_version wait
            for POST /revision; running; succeeded; failed — aborted (see error), still
            not serving.
        serving:             { type: boolean, description: False while data routes answer 503 NOT_READY. }
        render_version:      { type: string, description: The render_version docs are brought to. }
        force:               { type: boolean }
        started_at:          { type: integer, description: Unix epoch seconds. }
        finished_at:         { type: integer, description: Unix epoch seconds. }
        total:               { type: [integer, "null"], description: Docs to re-render (counted when the job starts). }
        revised:             { type: integer }
        quarantined:         { type: integer, description: Docs quarantined by this job. }
        quarantined_doc_ids: { type: array, items: { type: string }, description: The first 100 of them. }
        quarantined_total:   { type: integer, description: Docs quarantined on the volume. }
        eta_sec:             { type: [integer, "null"] }
        backup:              { type: string, description: The DB copy taken before the first write (the rollback point). }
        error:               { type: string, description: Why a failed job stopped. }

    DocList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/DocSummary' }
        next_cursor:
          type: [string, "null"]
          description: Pass as cursor to fetch the next page; null when exhausted.

    SearchFilter:
      type: object
      required: [key, value]
      properties:
        key:
          type: string
          description: Dotted JSON path; MUST be a declared/indexed key (else 400).
        op:
          type: string
          enum: [eq, ne, gt, gte, lt, lte]
          default: eq
        value:
          description: String for eq/ne on text fields; number for gt/gte/lt/lte on number fields.
          oneOf:
            - { type: string }
            - { type: number }

    SearchRequest:
      type: object
      properties:
        filters:
          type: array
          default: []
          description: AND-combined. Empty/omitted lists all documents, newest first.
          items: { $ref: '#/components/schemas/SearchFilter' }
        limit:  { type: integer, minimum: 1, maximum: 500, default: 50 }
        cursor: { type: [string, "null"] }

    MetadataObject:
      type: object
      description: Arbitrary JSON object. Declared keys are searchable; others stored only.
      additionalProperties: true

    MetadataFieldType:
      type: string
      enum: [text, number]

    MetadataSchema:
      type: object
      required: [version, fields]
      properties:
        version: { type: integer }
        fields:
          type: array
          items:
            type: object
            required: [key, type]
            properties:
              key:      { type: string, description: Dotted JSON path. }
              type:     { $ref: '#/components/schemas/MetadataFieldType' }
              required: { type: boolean, default: false }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: >
                Machine-readable error code. Non-exhaustive vocabulary: UNAUTHORIZED,
                UNKNOWN_DOC_TYPE, AMBIGUOUS_INPUT, MISSING_URL, MISSING_FILE,
                PAYLOAD_TOO_LARGE, UNSUPPORTED_MEDIA, SSRF_BLOCKED, UNKNOWN_DOC,
                DOC_INCOMPLETE, MISSING_BLOB, UNKNOWN_TILE, TILE_OUT_OF_RANGE, RANGE_NOT_SATISFIABLE,
                DELETE_DISABLED, UNDECLARED_FILTER_KEY, INVALID_METADATA_JSON,
                METADATA_SCHEMA_VIOLATION, RENDER_MISMATCH, DECODE_FAILED,
                EMPTY_DOCUMENT, BROWSER_UNAVAILABLE, RENDER_TIMEOUT, UPSTREAM_FAILURE,
                WORKER_CRASH, QUARANTINED, REVISION_RUNNING, NOT_READY, VALIDATION_ERROR,
                INTERNAL_ERROR.
            message: { type: string }
            details: { type: object, additionalProperties: true }

  responses:
    BadRequest:        { description: Bad request., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Forbidden:         { description: Blocked (e.g. SSRF)., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    NotFound:          { description: Not found., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    TooLarge:          { description: Payload too large., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    UnsupportedMedia:  { description: Content-type does not match declared doc_type., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Unprocessable:     { description: Corrupt document or invalid/schema-violating metadata., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    BadGateway:        { description: Upstream fetch/render failure., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    GatewayTimeout:    { description: Render timeout., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    NotReady:
      description: A revision is pending or running (NOT_READY); see GET /revision.
      headers:
        Retry-After: { schema: { type: integer }, description: Seconds to wait before retrying. }
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
