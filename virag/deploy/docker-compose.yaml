services:
  virag:
    build:
      context: ..
    image: ${VIRAG_DEPLOY_IMAGE}
    container_name: ${VIRAG_DEPLOY_CONTAINER_NAME}

    ports:
      - "${VIRAG_DEPLOY_HOST}:${VIRAG_DEPLOY_PORT}:8080"

    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

    env_file:
      - path: .env
        required: true

    depends_on:
      tiler-virag:
        condition: service_healthy
      qdrant-virag:
        condition: service_healthy
      embeddings-vllm-virag:
        condition: service_started

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    networks:
      - virag


  tiler-virag:
    build:
      context: ../../doc-tiler
      target: runtime
    image: ${TILER_DEPLOY_IMAGE}
    container_name: ${TILER_DEPLOY_CONTAINER_NAME}

    ports: 
      - "${TILER_DEPLOY_HOST}:${TILER_DEPLOY_PORT}:8080"
    volumes:
      - ${TILER_DEPLOY_VOLUME_PATH}:/data
      - ./tiler_metadata_schema.yaml:/config/metadata_schema.yaml:ro

    shm_size: "1gb"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

    env_file: 
      - path: .env
        required: true

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    networks:
      - virag


  qdrant-virag:
    image: ${QDRANT_DEPLOY_IMAGE}
    container_name: ${QDRANT_DEPLOY_CONTAINER_NAME}

    ports:
      - ${QDRANT_DEPLOY_HOST}:${QDRANT_DEPLOY_PORT}:6333
    volumes:
      - ${QDRANT_DEPLOY_VOLUME_PATH}:/qdrant/storage

    restart: unless-stopped

    env_file: 
      - path: .env
        required: true

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:6333/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

    networks:
      - virag


  embeddings-vllm-virag:
    image: ${VLLM_DEPLOY_IMAGE}
    container_name: ${VLLM_DEPLOY_CONTAINER_NAME}
    entrypoint: ["/bin/bash", "-lc"]
    command: ["bash /start.sh"]
    shm_size: "16g"

    ports:
      - "${VLLM_DEPLOY_HOST}:${VLLM_DEPLOY_PORT}:8000"
    volumes:
      - ${VLLM_DEPLOY_MODEL_PATH}:/model:ro
      - ./serve_vllm_embeddings.sh:/start.sh:ro

    ulimits:
      memlock: -1
      stack: 67108864

    runtime: nvidia
    restart: unless-stopped

    networks:
      - virag

networks:
  virag:
    driver: bridge

