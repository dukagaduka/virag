services:
  virag:
    build:
      context: ..
    image: ${VIRAG_DEPLOY_IMAGE}
    container_name: ${VIRAG_DEPLOY_CONTAINER_NAME}

    ports:
      - "${VIRAG_DEPLOY_HOST}:${VIRAG_DEPLOY_PORT}:8080"

    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

    env_file:
      - path: .env
        required: true

    depends_on:
      tiler-virag:
        condition: service_healthy
      qdrant-virag:
        # The qdrant image ships no curl/wget/bash, so an in-container HTTP healthcheck
        # isn't possible; gate on start only. virag connects during its lifespan (with
        # restart as a safety net) once qdrant is up (~1 s).
        condition: service_started
      embeddings-vllm-virag:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    networks:
      - virag


  tiler-virag:
    build:
      context: ../../doc-tiler
      target: runtime
    image: ${TILER_DEPLOY_IMAGE}
    container_name: ${TILER_DEPLOY_CONTAINER_NAME}

    ports: 
      - "${TILER_DEPLOY_HOST}:${TILER_DEPLOY_PORT}:8080"
    volumes:
      - ${TILER_DEPLOY_VOLUME_PATH}:/data
      - ./tiler_metadata_schema.yaml:/config/metadata_schema.yaml:ro

    shm_size: "1gb"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

    env_file: 
      - path: .env
        required: true

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    networks:
      - virag


  qdrant-virag:
    image: ${QDRANT_DEPLOY_IMAGE}
    container_name: ${QDRANT_DEPLOY_CONTAINER_NAME}

    ports:
      - ${QDRANT_DEPLOY_HOST}:${QDRANT_DEPLOY_PORT}:6333
    volumes:
      - ${QDRANT_DEPLOY_VOLUME_PATH}:/qdrant/storage

    restart: unless-stopped

    env_file:
      - path: .env
        required: true

    # No healthcheck: the qdrant image has no curl/wget/bash to probe with. Consumers
    # gate on service_started and retry their own connection.

    networks:
      - virag


  embeddings-vllm-virag:
    image: ${VLLM_DEPLOY_IMAGE}
    container_name: ${VLLM_DEPLOY_CONTAINER_NAME}
    entrypoint: ["/bin/bash", "-lc"]
    command: ["bash /start.sh"]
    shm_size: "16g"

    # The serve script is driven entirely by VLLM_* env vars; without this the
    # container falls back to script defaults and ignores the configured model name,
    # LoRA settings and 6 GB tuning.
    env_file:
      - path: .env
        required: true

    ports:
      - "${VLLM_DEPLOY_HOST}:${VLLM_DEPLOY_PORT}:8000"
    volumes:
      - ${VLLM_DEPLOY_MODEL_PATH}:/model:ro
      # LoRA adapter — internal path is the constant /adapter; only the host path
      # (VLLM_DEPLOY_ADAPTER_PATH) varies. Point it at the base model dir if unused.
      - ${VLLM_DEPLOY_ADAPTER_PATH}:/adapter:ro
      - ./serve_vllm_embeddings.sh:/start.sh:ro

    ulimits:
      memlock: -1
      stack: 67108864

    runtime: nvidia
    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD-SHELL",
          'curl -fsS -H "Authorization: Bearer ${VLLM_API_KEY}" http://localhost:8000/v1/models >/dev/null'
        ]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s

    networks:
      - virag

networks:
  virag:
    driver: bridge

