services:
  retriever-vllm-virag:
    image: ${RETRIEVER_DEPLOY_IMAGE}
    container_name: ${RETRIEVER_DEPLOY_CONTAINER_NAME}
    entrypoint: ["/bin/bash", "-lc"]
    command: ["bash /start.sh"]
    shm_size: "16g"

    ports:
      - "${RETRIEVER_DEPLOY_HOST}:${RETRIEVER_DEPLOY_PORT}:8000"
    volumes:
      - ${RETRIEVER_DEPLOY_MODEL_PATH}:/model:ro
      # LoRA adapter — internal path is the constant /adapter; only the host path
      # (RETRIEVER_DEPLOY_ADAPTER_PATH) varies. Point it at the base model dir if unused.
      - ${RETRIEVER_DEPLOY_ADAPTER_PATH}:/adapter:ro
      - ./serve_retriever.sh:/start.sh:ro

    ulimits:
      memlock: -1
      stack: 67108864

    runtime: nvidia
    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s
