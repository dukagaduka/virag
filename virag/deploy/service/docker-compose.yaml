# Three files configure the stack, each copied from its .example and filled in:
#   .env               compose itself: images, names, published hosts/ports, volumes
#   virag.env          virag (and the keys it holds for every backend)
#   tiler.env          doc-tiler
# plus configs/valkey.conf and configs/qdrant.yaml, which carry the Valkey password and
# the Qdrant API key. A secret shared by two services is written in both places, and
# virag refuses to start, naming the key, when its copy does not match.

services:
  virag:
    build:
      context: ../..
    image: ${VIRAG_DEPLOY_IMAGE}
    container_name: ${VIRAG_DEPLOY_CONTAINER_NAME}

    ports:
      - "${VIRAG_DEPLOY_HOST}:${VIRAG_DEPLOY_PORT}:8080"

    restart: unless-stopped
    # Above uvicorn's --timeout-graceful-shutdown (20 s): the shutdown releases the
    # lease, the revision job and the reconcile lead before SIGKILL.
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true

    env_file:
      - path: virag.env
        required: true

    # The retriever runs in a separate stack; virag reaches it via the host
    # (RETRIEVER_BASE_URL=http://host.docker.internal:<port>/v1).
    extra_hosts:
      - "host.docker.internal:host-gateway"

    depends_on:
      tiler-virag:
        condition: service_healthy
      qdrant-virag:
        # The qdrant image ships no curl/wget/bash, so an in-container HTTP healthcheck
        # isn't possible; gate on start only. virag connects during its lifespan (with
        # restart as a safety net) once qdrant is up (~1 s).
        condition: service_started
      valkey-virag:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    networks:
      - virag


  tiler-virag:
    build:
      context: ../../../doc-tiler
      target: runtime
    image: ${TILER_DEPLOY_IMAGE}
    container_name: ${TILER_DEPLOY_CONTAINER_NAME}

    # Published for tools on the host; virag reaches the tiler inside the network.
    ports:
      - "${TILER_DEPLOY_HOST}:${TILER_DEPLOY_PORT}:8080"
    volumes:
      - ${TILER_DEPLOY_VOLUME_PATH}:/data
      - ./tiler_metadata_schema.yaml:/config/metadata_schema.yaml:ro

    shm_size: "1gb"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

    env_file:
      - path: tiler.env
        required: true

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    networks:
      - virag


  qdrant-virag:
    image: ${QDRANT_DEPLOY_IMAGE}
    container_name: ${QDRANT_DEPLOY_CONTAINER_NAME}

    # Published for tools on the host (REST 6333 also serves the dashboard, gRPC 6334);
    # virag's data path is gRPC inside the network. The API key comes from qdrant.yaml,
    # merged over the image's defaults.
    ports:
      - ${QDRANT_DEPLOY_HOST}:${QDRANT_DEPLOY_PORT}:6333
      - ${QDRANT_DEPLOY_HOST}:${QDRANT_DEPLOY_GRPC_PORT}:6334
    volumes:
      - ${QDRANT_DEPLOY_VOLUME_PATH}:/qdrant/storage
      - ./configs/qdrant.yaml:/qdrant/config/production.yaml:ro

    restart: unless-stopped

    # No healthcheck: the qdrant image has no curl/wget/bash to probe with. Consumers
    # gate on service_started and retry their own connection.

    networks:
      - virag


  valkey-virag:
    image: ${VALKEY_DEPLOY_IMAGE}
    container_name: ${VALKEY_DEPLOY_CONTAINER_NAME}

    # Coordination of virag processes only (leases, writers, the revision lock); no
    # port is published — virag reaches it inside the network. valkey.conf holds the
    # password (requirepass) and AOF, which keeps a journal of an in-flight revision
    # across a short Valkey restart.
    command: ["valkey-server", "/usr/local/etc/valkey/valkey.conf"]
    volumes:
      - ./configs/valkey.conf:/usr/local/etc/valkey/valkey.conf:ro
      - ${VALKEY_DEPLOY_VOLUME_PATH}:/data

    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

    # Liveness without the password: an answer, PONG or NOAUTH, means the server is up.
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping 2>&1 | grep -qE 'PONG|NOAUTH'"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

    networks:
      - virag

networks:
  virag:
    driver: bridge

