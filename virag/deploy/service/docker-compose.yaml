services:
  virag:
    build:
      context: ../..
    image: ${VIRAG_DEPLOY_IMAGE}
    container_name: ${VIRAG_DEPLOY_CONTAINER_NAME}

    ports:
      - "${VIRAG_DEPLOY_HOST}:${VIRAG_DEPLOY_PORT}:8080"

    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

    env_file:
      - path: .env
        required: true

    # The retriever runs in a separate stack; virag reaches it via the host
    # (RETRIEVER_BASE_URL=http://host.docker.internal:<port>/v1).
    extra_hosts:
      - "host.docker.internal:host-gateway"

    depends_on:
      tiler-virag:
        condition: service_healthy
      qdrant-virag:
        # The qdrant image ships no curl/wget/bash, so an in-container HTTP healthcheck
        # isn't possible; gate on start only. virag connects during its lifespan (with
        # restart as a safety net) once qdrant is up (~1 s).
        condition: service_started

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    networks:
      - virag


  tiler-virag:
    build:
      context: ../../../doc-tiler
      target: runtime
    image: ${TILER_DEPLOY_IMAGE}
    container_name: ${TILER_DEPLOY_CONTAINER_NAME}

    ports: 
      - "${TILER_DEPLOY_HOST}:${TILER_DEPLOY_PORT}:8080"
    volumes:
      - ${TILER_DEPLOY_VOLUME_PATH}:/data
      - ./tiler_metadata_schema.yaml:/config/metadata_schema.yaml:ro

    shm_size: "1gb"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

    env_file: 
      - path: .env
        required: true

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    networks:
      - virag


  qdrant-virag:
    image: ${QDRANT_DEPLOY_IMAGE}
    container_name: ${QDRANT_DEPLOY_CONTAINER_NAME}

    ports:
      - ${QDRANT_DEPLOY_HOST}:${QDRANT_DEPLOY_PORT}:6333
    volumes:
      - ${QDRANT_DEPLOY_VOLUME_PATH}:/qdrant/storage

    restart: unless-stopped

    env_file:
      - path: .env
        required: true

    # No healthcheck: the qdrant image has no curl/wget/bash to probe with. Consumers
    # gate on service_started and retry their own connection.

    networks:
      - virag

networks:
  virag:
    driver: bridge

