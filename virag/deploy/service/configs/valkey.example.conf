# Valkey for virag's coordination. Copy to valkey.conf (git-ignored) and set requirepass;
# virag's VALKEY_URL in virag.env must carry the same password:
#   VALKEY_URL=redis://:<password>@valkey-virag:6379/0
# Generate one: openssl rand -hex 32

port 6379
dir /data

# The password every client must present; whoever writes to Valkey can take the
# revision job or stop a virag process by deleting its lease.
requirepass dummy

# AOF keeps the journal of an in-flight revision across a short Valkey restart.
appendonly yes
appendfsync everysec
